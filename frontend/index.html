<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driver Assignment Dashboard | Manivtha Tours & Travels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div id="loginScreen" class="login-screen">
      <div class="login-panel fade-in">
        <div class="brand-mark"><i class="fa-solid fa-route"></i></div>
        <h1>Manivtha Tours & Travels</h1>
        <p>Driver Assignment Dashboard</p>
        <form id="loginForm" class="mt-4">
          <label class="form-label" for="loginEmail">Email</label>
          <input id="loginEmail" class="form-control" type="email" value="admin@manivthatours.com" required>
          <label class="form-label mt-3" for="loginPassword">Password</label>
          <input id="loginPassword" class="form-control" type="password" value="Admin@123" required>
          <button class="btn btn-primary w-100 mt-4" type="submit">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Login
          </button>
          <div id="loginError" class="alert alert-danger d-none mt-3 mb-0"></div>
        </form>
      </div>
    </div>

    <div id="appShell" class="app-shell d-none">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark small"><i class="fa-solid fa-route"></i></div>
          <div>
            <strong>Manivtha</strong>
            <span>Tours & Travels</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="sidebarToggle" class="icon-btn" type="button" title="Toggle sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h2 id="pageTitle">Dashboard</h2>
            <span id="pageSubtitle">Centralized driver assignment operations</span>
          </div>
          <div class="topbar-actions">
            <div class="user-chip">
              <i class="fa-solid fa-user-shield"></i>
              <span id="userName">Admin</span>
            </div>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm" type="button">
              <i class="fa-solid fa-arrow-right-from-bracket me-1"></i>Logout
            </button>
          </div>
        </header>

        <div id="loader" class="loader d-none"><span></span>Loading</div>
        <section id="content" class="content fade-in"></section>
      </main>
    </div>

    <div class="modal fade" id="entityModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="modalTitle" class="modal-title"></h5>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="entityForm">
            <div id="modalBody" class="modal-body row g-3"></div>
            <div class="modal-footer">
              <button class="btn btn-light" type="button" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastHost" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
